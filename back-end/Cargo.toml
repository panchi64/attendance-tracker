[package]
name = "back-end"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "attendance-tracker"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = "4.11.0"
actix-cors = "0.7.1"
actix-files = "0.6.8"
actix-multipart = "0.7.2" # For file uploads
actix-web-actors = "4.3.1" # For WebSockets
actix = "0.13.5" # Actor framework
actix-governor = "0.6.0" # Rate limiting

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "json"] }
tokio = { version = "1.47.1", features = ["full"] } # Update tokio

# Serialization/Deserialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# QR code generation
qrcode = "0.14.1"
image = { version = "0.25.8", default-features = false, features = ["png"] } # Specify PNG support

# Utilities
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
csv = "1.3.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.28"
local-ip-address = "0.6.5"
webbrowser = "1.0.5" # For opening browser
anyhow = "1.0.100" # Error handling
thiserror = "2.0.17" # Error handling derivation
futures-util = "0.3.31" # For stream processing in multipart
rand = "0.9.2" # For confirmation code generation
validator = { version = "0.19.0", features = ["derive"] } # Input validation

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
opt-level = 3
